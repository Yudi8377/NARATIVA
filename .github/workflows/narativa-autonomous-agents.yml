name: NARATIVA Autonomous Quality Agents

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/**"
      - "supabase/**"
      - ".github/workflows/narativa-autonomous-agents.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: narativa-autonomous-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Multi-agent quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Agent — syntax and existing production contracts
        run: |
          node --check scripts/narativa-agents-audit.mjs
          node --check scripts/site-smoke.test.mjs
          node --check scripts/supabase-security-contracts.test.mjs
          node --check scripts/live-healthcheck.mjs
          node --check scripts/ai-audit-review.mjs
          node --check website/app.js
          node --check website/reader-catalog.js
          node --check website/experiences.js
          node scripts/production-contracts.test.mjs
          node scripts/site-smoke.test.mjs
          node scripts/supabase-security-contracts.test.mjs
      - name: Agent — SEO, security, performance, accessibility, functional audit
        run: node scripts/narativa-agents-audit.mjs
      - name: Optional AI reviewer — prioritize findings
        if: always()
        continue-on-error: true
        env:
          NARATIVA_AI_API_KEY: ${{ secrets.NARATIVA_AI_API_KEY }}
          NARATIVA_AI_BASE_URL: ${{ vars.NARATIVA_AI_BASE_URL }}
          NARATIVA_AI_MODEL: ${{ vars.NARATIVA_AI_MODEL }}
        run: node scripts/ai-audit-review.mjs
      - name: Store audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narativa-quality-report-${{ github.run_number }}
          path: artifacts/narativa-*
          if-no-files-found: warn
          retention-days: 30
