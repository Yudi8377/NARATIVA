name: Deploy NARATIVA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate connector manager assets
        run: |
          test -s website/connector-manager.html
          test -s website/connector-manager.js
          test -s website/experience.css
          test -s website/vendor/supabase.js
          node --check website/connector-manager.js
          grep -q 'connector-manager.js' website/connector-manager.html
          grep -q 'experience.css' website/connector-manager.html
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
