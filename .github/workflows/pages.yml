name: Deploy NARATIVA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/**"
      - "docs/**"
      - "supabase/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate connector manager assets
        run: |
          test -s website/video.html
          grep -q 'watchSourceForm' website/video.html
          grep -q 'youtube-nocookie.com/embed' website/video.js
          grep -q 'narativa.video.external-sources' website/video.js
          test -s website/admin-console.js
          test -s supabase/functions/admin-console/index.ts
          test -s supabase/functions/ai-mentor/index.ts
          test -s supabase/functions/production-engine/index.ts
          test -s supabase/migrations/20261012020100_narativa_production_jobs.sql
          test -s docs/PRODUCTION-ENGINES.md
          test -s supabase/migrations/20261012020021_narativa_ai_mentor_usage.sql
          test -s docs/AI-MENTOR-PROVIDER.md
          test -s supabase/migrations/20261012015258_narativa_secure_admin_console.sql
          test -s supabase/migrations/20261012015602_narativa_commerce_catalog_ledger.sql
          test -s docs/COMMERCE-CATALOG-LEDGER.md
          test -s docs/ADMIN-CONSOLE-SECURITY.md
          grep -q 'admin-console.js' website/admin.html
          test -s website/connector-manager.html
          test -s website/connector-manager.js
          test -s website/experience.css
          test -s website/vendor/supabase.js
          node --check website/admin-console.js
          node --check website/connector-manager.js
          node --check website/learning.js
          node --check website/video.js
          node --check website/reader-catalog.js
          node --check website/experiences.js
          node --check scripts/library-import.mjs
          node --check scripts/production-contracts.test.mjs
          node scripts/production-contracts.test.mjs
          node -e "JSON.parse(require('fs').readFileSync('scripts/library-sources.json','utf8'))"
          test -s docs/library-importer.md
          test -s docs/PRODUCTION-READINESS-AUDIT.md
          test -s website/library/comics/kota-di-atas-awan/page-01.svg
          test -s website/library/comics/kota-di-atas-awan/page-06.svg
          test -s website/library/manga/komet-terakhir/page-01.svg
          test -s website/library/manga/komet-terakhir/page-04.svg
          test -s website/library/manhwa/senja-di-stasiun/page-01.svg
          test -s website/library/manhwa/senja-di-stasiun/page-04.svg
          grep -q 'local-manhwa-station' website/reader-catalog.js
          test -s website/library/anime/satu-bintang-lagi.html
          test -s website/library/importer.html
          grep -q 'local-sky-comic' website/reader-catalog.js
          grep -q 'local-komet-manga' website/reader-catalog.js
          grep -q 'local-anime-star' website/reader-catalog.js
          grep -q 'NARATIVA Library Import' .github/workflows/library-import.yml
          grep -q 'id="learningContext"' website/learning.html
          grep -q 'id="masteryCheck"' website/learning.html
          grep -q 'function contextualPlan' website/learning.js
          grep -q 'learningSourceLinks' website/learning.js
          grep -q 'connector-manager.js' website/connector-manager.html
          grep -q 'experience.css' website/connector-manager.html
          grep -q 'vendorResults' website/connector-manager.html
          test "$(grep -o "name:'" website/connector-manager.js | wc -l)" -eq 31
          grep -q 'Lihat kebutuhan dan langkah konfigurasi' website/connector-manager.js
          grep -q 'noopener noreferrer' website/connector-manager.js
          grep -q 'woocommerce-connect' website/connector-manager.js
          grep -q 'wooConnectForm' website/connector-manager.html
          test -s supabase/functions/woocommerce-connect/index.ts
          test -s supabase/migrations/202610110002_narativa_connector_connections.sql
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
