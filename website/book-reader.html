<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12110f">
<meta name="description" content="Buku interaktif NARATIVA dengan sampul, daftar isi, dan animasi membalik halaman.">
<title>Buku Interaktif — NARATIVA</title>
<link rel="stylesheet" href="book-reader.css">
<script defer src="reader-catalog.js"></script><script defer src="book-reader.js"></script>
</head>
<body>
<main class="reader-shell">
<header class="reader-topbar">
  <a class="wordmark" href="reader.html" title="Kembali ke katalog">NARATIVA <span>BOOKS</span></a>
  <div class="book-heading"><span>RUANG BACA INTERAKTIF</span><h1 id="bookTitle">Memuat buku…</h1></div>
  <div class="top-actions"><button id="screenMode" type="button" aria-pressed="false">⛶ Layar penuh</button><button id="exitReader" class="close-button" type="button" aria-label="Keluar dari buku" title="Keluar">×</button></div>
</header>
<section class="book-stage" aria-label="Buku interaktif">
  <div class="book-shadow"></div>
  <button id="previous" class="edge-control edge-prev" type="button" aria-label="Halaman sebelumnya" title="Kembali">‹</button>
  <div class="book-frame" id="bookFrame">
    <div class="page-underlay"></div>
    <article id="bookPage" class="book-page" aria-live="polite"></article>
    <div id="turnLayer" class="turn-layer" aria-hidden="true" hidden></div>
    <svg id="pageCurl" class="page-curl" aria-hidden="true" viewBox="0 0 760 760" preserveAspectRatio="none">
      <defs>
        <linearGradient id="curlPaperGradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fffdf5"/>
          <stop offset=".28" stop-color="#f8f0df"/>
          <stop offset=".57" stop-color="#e7d9c1"/>
          <stop offset=".82" stop-color="#b7a487"/>
          <stop offset="1" stop-color="#756047"/>
        </linearGradient>
        <linearGradient id="curlShadeGradient" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#372a19" stop-opacity="0"/>
          <stop offset=".52" stop-color="#372a19" stop-opacity=".08"/>
          <stop offset="1" stop-color="#24190e" stop-opacity=".55"/>
        </linearGradient>
        <filter id="curlSoftShadow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="5"/>
        </filter>
      </defs>
      <path id="curlDropShadow" fill="#17110a" opacity=".3" filter="url(#curlSoftShadow)"></path>
      <path id="curlPaperShape" fill="url(#curlPaperGradient)" stroke="#b5a183" stroke-width=".8" stroke-linejoin="round"></path>
      <path id="curlPaperShade" fill="url(#curlShadeGradient)" opacity=".6"></path>
      <path id="curlCrease" fill="none" stroke="#fff9e8" stroke-opacity=".85" stroke-width="1.4"></path>
    </svg>
    <div class="page-curl-hint" aria-hidden="true"></div>
  </div>
  <button id="next" class="edge-control edge-next" type="button" aria-label="Halaman berikutnya" title="Halaman berikutnya">›</button>
</section>
<footer class="reader-controls">
  <button id="previousBottom" type="button">← Kembali</button>
  <div class="page-progress"><span id="pageLabel">Sampul</span><div class="progress-track"><i id="progressBar"></i></div></div>
  <button id="nextBottom" class="next-action" type="button">Buka buku →</button>
  <button id="download" class="download-action" type="button">Unduh halaman</button>
</footer>
<p id="readerNote" class="reader-note" aria-live="polite"></p>
</main>
</body></html>
